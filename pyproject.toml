[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "horror-photobooth"
version = "1.0.0"
description = "A real-time horror-themed photobooth using OpenCV and MediaPipe Tasks API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "numpy>=1.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort import sorting
    "B",   # flake8-bugbear
    "S",   # flake8-bandit security
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"build.py" = ["S603", "S404"]

[tool.bandit]
targets = ["."]
exclude_dirs = ["tests", ".venv", "venv", "__pycache__"]
skips = ["B310", "B404", "B603"]

[tool.coverage.run]
source = ["."]
omit = [
    "build.py",
    "tests/*",
    "venv/*",
    ".venv/*",
    "__pycache__/*"
]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "def main\\(\\):"
]